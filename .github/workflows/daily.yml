name: daily

on:
  schedule:
    # 05:23 UTC = 07:23 Stockholm (summer) / 06:23 (winter). Off the hour because GitHub delays
    # and sometimes drops scheduled runs at the start of the hour. Service dates are chosen in
    # Stockholm time in pipeline.py, so the trigger's time zone does not matter.
    # This cron trigger is a fallback: cron-job.org starts the workflow daily via
    # workflow_dispatch, since this schedule has not fired on GitHub's side (D-023).
    - cron: "23 5 * * *"
  workflow_dispatch:
    inputs:
      dates:
        description: "Explicit date or range 'A..B' (YYYY-MM-DD); overrides auto-selection"
        required: false
        type: string
      max_dates:
        description: "Maximum number of dates to process this run"
        required: false
        type: string
      skip_sheet:
        description: "Don't touch the Google Sheet"
        required: false
        type: boolean
        default: false

concurrency:
  group: pipeline
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5

      - name: Install dependencies
        run: uv sync --frozen

      - name: Write Google service account file
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: printf '%s' "$GOOGLE_SERVICE_ACCOUNT_JSON" > "$RUNNER_TEMP/sa.json"

      - name: Run the daily pipeline
        env:
          TRAFIKLAB_KODA_KEY: ${{ secrets.TRAFIKLAB_KODA_KEY }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_DATASET_REPO: ${{ vars.HF_DATASET_REPO }}
          GOOGLE_SERVICE_ACCOUNT_FILE: ${{ runner.temp }}/sa.json
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
          DISPATCH_DATES: ${{ inputs.dates }}
          DISPATCH_MAX_DATES: ${{ inputs.max_dates }}
          DISPATCH_SKIP_SHEET: ${{ inputs.skip_sheet }}
        run: |
          args=()
          if [ -n "$DISPATCH_DATES" ]; then args+=(--dates "$DISPATCH_DATES"); fi
          if [ -n "$DISPATCH_MAX_DATES" ]; then args+=(--max-dates "$DISPATCH_MAX_DATES"); fi
          if [ "$DISPATCH_SKIP_SHEET" = "true" ]; then args+=(--skip-sheet); fi
          uv run python -m kronoberg_transit.pipeline "${args[@]}"
