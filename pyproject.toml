[project]
name = "kronoberg-transit"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Marcus", email = "marcus.brorsson@protonmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "duckdb>=1.5.5",
    "google-auth>=2.58.0",
    "gspread>=6.2.1",
    "gtfs-realtime-bindings>=3.0.0",
    "httpx>=0.28.1",
    "huggingface-hub>=1.32.0",
    "numpy>=2.5.3",
    "py7zr>=1.1.3",
    "pyarrow>=25.0.1",
    "python-dotenv>=1.2.3",
    "tzdata>=2026.4",
]

[project.scripts]
kronoberg-transit = "kronoberg_transit:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.8",
]

[tool.ruff]
line-length = 100
target-version = "py312"
